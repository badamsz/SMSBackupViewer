name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build & test (macOS)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # The SwiftUI app needs full Xcode (the SwiftUI macro plugin isn't in the Command Line Tools).
      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Toolchain info
        run: |
          xcodebuild -version
          swift --version

      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-${{ hashFiles('Sources/**/*.swift') }}
          restore-keys: |
            spm-${{ runner.os }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-
            spm-${{ runner.os }}-

      - name: Run tests
        run: swift test

      - name: Build app bundle
        run: ./build-app.sh

      - name: MCP server smoke test
        run: ./Scripts/mcp-smoke-test.sh "build/SMS Backup Viewer.app/Contents/MacOS/smsbackup-mcp"

      - name: Package app
        run: ditto -c -k --keepParent "build/SMS Backup Viewer.app" "build/SMS-Backup-Viewer.zip"

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: SMS-Backup-Viewer-${{ github.sha }}
          path: build/SMS-Backup-Viewer.zip
          retention-days: 14
